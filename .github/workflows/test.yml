name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Only the credential-free layer. The tool tests reach live Algolia, so
      # they run where a key already exists rather than putting one in repo
      # secrets for no gain.
      - run: npm run test:unit
